name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Character Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Character Set Compliance (Zero Em Dashes)
        run: python3 scripts/check_no_em_dashes.py

  linux-build-and-test:
    name: Linux Build & Test Suite (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            valac \
            meson \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libgee-0.8-dev \
            libjson-glib-dev \
            libssl-dev \
            python3

      - name: Configure Meson Build
        run: meson setup build --buildtype=debugoptimized

      - name: Compile Native Targets
        run: ninja -C build

      - name: Execute Full Test Suite
        run: meson test -C build --print-errorlogs --verbose

      - name: Execute Inter-SFU Cascade Benchmark
        run: ./build/bench_cascade_mesh

      - name: Execute Python Client SDK Unit Tests
        run: python3 sdk/python/test_sdk.py

  macos-build-and-test:
    name: macOS ARM64 Build & Test Suite
    needs: lint
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Homebrew Dependencies
        run: |
          brew install vala meson ninja pkg-config glib libgee json-glib openssl@3

      - name: Configure Meson Build
        run: meson setup build --buildtype=debugoptimized

      - name: Compile Native Targets
        run: ninja -C build

      - name: Execute Full Test Suite
        run: meson test -C build --print-errorlogs --verbose

      - name: Execute Inter-SFU Cascade Benchmark
        run: ./build/bench_cascade_mesh
